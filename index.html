<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1C33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PCQ HUB" />
  <title>PCQ HUB</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar app">
    <div class="brand">
      <h1 class="mark">PCQ HUB</h1>
    </div>
    <div class="top-actions">
      <button class="btn btn-primary" data-action="new-contact">Fiche</button>
      <button class="btn" data-action="new-event">Rencontre</button>
    </div>
  </header>
  <nav class="nav" aria-label="Sections">
    <button data-view="accueil" class="active">Accueil</button>
    <button data-view="fiches">Fiches</button>
    <button data-view="agenda">Agenda</button>
    <button data-view="reglages">Réglages</button>
  </nav>
  <main id="app" class="app"></main>
  <div id="modal" class="modal-back"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="partage.js"></script>
  <script src="app.js"></script>
</body>
</html>
